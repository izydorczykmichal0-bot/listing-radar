# Listing Radar — co5 minut sprawdza nowe listowania CoinGecko/SafeTrade
# i wysyła alerty na Telegram. Stan trzymamy w pliku state.json (commit
# tylko, gdy faktycznie się zmienił).
#
# UWAGA: harmonogramy GitHuba dotyczą PUBLICZNYCH repo (limity minut są
# wtedy nieskończone). Jeśli repo masz prywatne — zmień '*/5' na '*/10'
# niżej (960 przebiegów/mies. mieści się w2000 darmowych minutach).
name: Listing Radar

on:
  schedule:
    - cron: '2-57/5 * * * *'   # prywatne repo? daj '*/10 * * * *'
  workflow_dispatch:         # ręczny przycisk "Run workflow"

permissions:
  contents: write            # żeby móc zapisać state.json z powrotem

concurrency:
  group: listing-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zależności
        run: pip install -r requirements.txt

      - name: Config.json z sekretów
        env:
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os
          cfg = {
              "coingecko_api_key": os.environ.get("CG_API_KEY", ""),
              "telegram": {
                  "bot_token": os.environ.get("TG_BOT_TOKEN", ""),
                  "chat_id": os.environ.get("TG_CHAT_ID", ""),
              },
              "intervals": {"coingecko": 300, "safetrade": 120},
              "daily_report": {"enabled": True, "hour": 9, "minute": 0},
              "cross_window_days": 14,
              "cg_exchange_id": "safe_trade",
              "fetch_cg_exchange_tickers": True,
              "enrich_tickers": True,
              "db_path": "listing_radar.db",
              "log_path": "alerts.log",
              "max_events_per_cycle": 30,
          }
          with open("config.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2, ensure_ascii=False)
          PY

      - name: Wczytaj poprzedni stan
        run: python -m radar import-state state.json

      - name: Sprawdź listowania
        run: python -m radar check

      - name: Zapisz stan
        run: python -m radar export-state state.json

      - name: Commit i push (tylko gdy stan się zmienił)
        run: |
          git config user.name "listing-radar[bot]"
          git config user.email "listing-radar@users.noreply.github.com"

          CHANGED=0

          # WAŻNE: najpierw `git add`, potem porównanie STAGED z HEAD.
          # Zwykły `git diff` nie widzi nowych (nieśledzonych) plików — przez
          # to pierwszy przebieg nigdy nie zapisał state.json i każda próba
          # startowała bazę od nowa.
          git add state.json
          if ! git diff --cached --quiet -- state.json; then
            CHANGED=1
          fi

          # heartbeat: odświeżamy, gdy pliku brak albo data ZAPISANA W PLIKU
          # ma >=6 dni (mtime NIE działa — checkout GitHuba zawsze ustawia
          # świeży czas pliku, więc stare `find -mtime` nigdy nie zadziała).
          STAMP=$(cut -dT -f1 last_run.txt 2>/dev/null | head -n1)
          case "$STAMP" in ????-??-??) ;; *) STAMP="1970-01-01" ;; esac
          DAYS=$(( ( $(date -u +%s) - $(date -u -d "$STAMP" +%s) ) / 86400 ))
          if [ "$DAYS" -ge 6 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > last_run.txt
            git add last_run.txt
            CHANGED=1
          fi

          if [ "$CHANGED" = "1" ]; then
            git commit -m "radar: aktualizacja stanu"
            git push
          else
            echo "Stan bez zmian — nie wysyłam commita."
          fi
# rejestrowanie harmonogramu
